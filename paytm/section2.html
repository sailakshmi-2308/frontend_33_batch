<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
          body {
        font-family: sans-serif;
      background-color: whitesmoke;
      }
      .credit-paytm-container{
        display:flex;
        gap:20px;
        margin:3%
      }
        .credit-card-container{
            /* border:2px solid black; */
            padding:5% 5% 4% 3%;
            border-radius:15px
        }
        .credit-card-container .cards-image{
            width:20%
        } 
        .credit-card-container .bank-image{
            width:40%
        }
        .credit-card-container .rupay-cards{
            width:100%
        }
        .apply{
            display:flex
        }
        .apply a{
            color:#002970;
            border:1px solid #002970;
            padding:10px;
            border-radius:999px;
            text-decoration: none;
            margin-right:20px
          
        }
        .apply a:hover{
            color:white;
            background-color: #002970;
        }
        .satheesh{
            background-image: url(https://assetscdn1.paytm.com/images/catalog/view_item/1725638720587.png);
background-repeat: no-repeat;
background-size: cover;
/* background-position: center; */
        }
        
        .family{
                background: linear-gradient(#D3F5FF, #FFFFFF);

        }
        
    </style>
  </head>
  <body>
    <div class="credit-paytm-container">
      <div class="credit-card-container satheesh">
        <img
        class="cards-image"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988623/27220898816562102.png"
          alt=""
        />
        <h1>One destination for <br> <span style="color:#00BAF2">Credit Cards</span></h1>
        <p>
          Paytm HDFC, SBI Card & Axis Bank Credit Card with <br> assured Cashback and
          incredible offers.
        </p>
        <div class="apply">
        <a href="">Apply Now <i class="fa-solid fa-right-long"></i></a>
        <img
        class="bank-image"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/1741675100265.png"
          alt=""
        />
        </div>
        <img
        class="rupay-cards"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988623/27221716933469500.png"
          alt=""
        />
      </div>
       <div class="credit-card-container family">
        <img
        class="cards-image"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2834804/1725623952233.png"
          alt=""
        />
        <h1>Insurance ka<br>  <span style="color:#00BAF2">Super Market</span></h1>
        <p>
          A Smart, Simple & Transparent Platform to Explore & Purchase Insurance.
        </p>
        <div class="apply">
        <a href="">Get It Now<i class="fa-solid fa-right-long"></i></a>
      
        </div>
        <img
        class="rupay-cards"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988624/27217428616091880.png"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
