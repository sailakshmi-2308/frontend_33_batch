  <head>

  <body>
    <form action="https://www.amazon.in/">
      <p>
        <input type="text" placeholder="enter your name" required />

        <label for="">enter your passeword</label>

      </p>
      <p>
        <label for="">enter your passedout date</label>
        <input type="date" /><br />
      </p>
      <p>
        
        <label for="male">male</label>
        <input type="radio" name="gender" id="male" />
     

     
        <label for="sandeep">female</label>
        <input checked type="radio" name="gender" id="sandeep" />
      </p>

      <p>

        <input id="madhu" type="checkbox" />

        <input id="meghana" type="checkbox" />
      </p>

      <p>
        <input type="file" />
      </p>

      <p>
        <select name="" id="">

          <option value="">20th batch</option>
          <option value="">23rd batch</option>
          <option value="">40th batch</option>
        </select>
      </p>
      <p>
        <!-- <input type="button"> -->
        <button>Submit</button>
      </p>
    </form>
