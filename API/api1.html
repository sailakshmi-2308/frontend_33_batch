<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        #doctors {
            display: flex;
            justify-content: space-evenly;
        }

        .card {
            border: 2px solid black;
            padding: 20px;
            width: 20%
        }
    </style>
</head>

<body>

    <div id="doctors">

    </div>


    <script>

        function getDoctors() {
            axios.get("https://doc-back.onrender.com/doctors")
                .then((result) => {
                    // console.log(result.data);

                    showDoctors(result.data)
                })

        }
        function showDoctors(balaji) {
            console.log(balaji);
            balaji.map((i) => {
                console.log(i.name);

                document.getElementById("doctors").innerHTML += `
                
                
                <div class="card"> 
                    <p>${i.name}</p>
                    <p>${i.salary}</p>
                    <p>${i.gender}</p>
                        <p>${i.age}</p>
                          <p>${i.specialization}</p>
                          <button onclick="deleteDoctors(${i.id})">delete</button>
                        <button onclick="updateDoctors(${i.id},'${i.name}',${i.salary},'${i.gender}',${i.age},'${i.specialization}')">update</button>
                 </div>
                
                `




            })

        }

        function deleteDoctors(id) {

            axios.delete(`https://doc-back.onrender.com/doctors/${id}`)
                .then((res) => {
                    console.log(res);
                    alert("deleted successfully");
                    getDoctors()

                })



        }


        function updateDoctors(id, oldname, oldsalary, oldgender, oldage, oldspecialization) {
            console.log(oldname);

            let newName = prompt("wnter your new name", oldname)
            let newSalary = prompt("enter your  new salary", oldsalary)
            let newGender = prompt("enter your  new gender", oldgender)
            let newAge = prompt("enter your  new age", oldage)
            let newSpecialization = prompt("enter your  new specialization", oldspecialization)


            axios.put(`https://doc-back.onrender.com/doctors/${id}`, {
                name: newName,
                salary: newSalary,
                gender: newGender,
                age: newAge,
                specialization: newSpecialization

            })
                .then((response) => {
                    alert("updated successfully");
                    getDoctors()

                }).catch((error)=>{
                    console.log(error)

                })

        }



        getDoctors()
    </script>
</body>

</html>
